name: Deploy with Jules to Vercel

# Trigger the workflow on push or merge to the main branch
on:
  push:
    branches: [ "main" ]
  # Also trigger on pull request merge to main
  pull_request:
    branches: [ "main" ]
    types: [closed]

# Environment variables available to all jobs
env:
  NODE_VERSION: '18'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Only run deployment on push to main or when PR is merged to main
    if: github.ref == 'refs/heads/main' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      # Jules will handle additional repository operations, but we need the base checkout
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for better Jules integration
          fetch-depth: 0

      # Step 2: Set up Node.js environment
      # This ensures we have the correct Node.js version for Jules operations
      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Use npm cache for faster dependency installation
          cache: 'npm'

      # Step 3: Install Jules
      # Google Jules is the automation tool that will handle our deployment process
      - name: 🤖 Install Google Jules
        run: |
          # Install Jules globally to make it available for subsequent steps
          npm install -g @google-research/jules
          # Verify Jules installation
          jules --version
        env:
          # Provide access to npm registry if needed
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Step 4: Configure Jules for Repository Operations
      # Jules will clone and prepare the repository for deployment
      - name: 📦 Jules Repository Setup
        run: |
          # Initialize Jules with current repository context
          jules init --project-type=nextjs
          # Configure Jules for Vercel deployment
          jules config set deployment.platform vercel
          jules config set deployment.token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Step 5: Jules Dependency Installation
      # Let Jules handle dependency installation with optimizations
      - name: 📚 Jules Install Dependencies
        run: |
          # Jules will analyze package.json and install dependencies optimally
          # It handles both npm and pnpm automatically based on lockfile detection
          jules install --optimize
        env:
          # Provide access to private registries if needed
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Step 6: Jules Build Process
      # Jules will build the Next.js application with optimizations
      - name: 🏗️ Jules Build Application
        run: |
          # Jules builds with production optimizations and error handling
          jules build --env=production --optimize
          # Verify build output
          jules verify build
        env:
          # Environment variables for build process
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      # Step 7: Jules Vercel Deployment
      # Jules will handle the deployment to Vercel using the configured token
      - name: 🚀 Jules Deploy to Vercel
        run: |
          # Jules deploys to Vercel with production settings
          jules deploy vercel --production --confirm
          # Get deployment URL and save to environment
          DEPLOYMENT_URL=$(jules get deployment.url)
          echo "DEPLOYMENT_URL=$DEPLOYMENT_URL" >> $GITHUB_ENV
          echo "🌍 Deployment URL: $DEPLOYMENT_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Step 8: Post-deployment Verification
      # Jules will verify the deployment is working correctly
      - name: ✅ Jules Deployment Verification
        run: |
          # Verify deployment health
          jules verify deployment --url="$DEPLOYMENT_URL" --timeout=300
          # Run basic smoke tests
          jules test deployment --quick
        env:
          DEPLOYMENT_URL: ${{ env.DEPLOYMENT_URL }}

      # Step 9: Cleanup and Reporting
      # Clean up temporary files and report deployment status
      - name: 🧹 Jules Cleanup and Report
        run: |
          # Generate deployment report
          jules report deployment --format=json > deployment-report.json
          # Clean up temporary files
          jules cleanup
          # Display summary
          echo "✨ Deployment completed successfully!"
          echo "📊 View deployment at: $DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ env.DEPLOYMENT_URL }}

      # Step 10: Upload Deployment Artifacts
      # Save deployment reports and logs for future reference
      - name: 📤 Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            deployment-report.json
            .vercel/
          retention-days: 30

      # Step 11: Comment on PR (if applicable)
      # Add deployment information to PR comments for visibility
      - name: 💬 Comment on PR
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Deployment Successful!**
              
              Your changes have been deployed to Vercel using Jules automation.
              
              **Deployment URL:** ${process.env.DEPLOYMENT_URL}
              
              **Deployed commit:** ${context.sha.substring(0, 7)}
              
              The deployment was handled automatically by Jules and is now live.`
            })
        env:
          DEPLOYMENT_URL: ${{ env.DEPLOYMENT_URL }}